<!DOCTYPE html>
<html lang="en"
      data-default-theme="minimal"
      data-theme-lock="minimal"
      data-default-mode="light"
      data-default-brand="#0ea5e9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        .tool-stack { display: grid; gap: var(--crusher-spacing-6); max-width: 42rem; margin-inline: auto; }
        .tool-section { padding: var(--crusher-spacing-6); display: grid; gap: var(--crusher-spacing-4); }
        .tool-label { display: block; margin-bottom: var(--crusher-spacing-1); font-size: var(--crusher-font-size-sm); color: var(--crusher-text-secondary); }
        .tool-grid-2 { display: grid; gap: var(--crusher-spacing-4); grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .tool-action-row { display: flex; justify-content: center; }
        .tool-copy-row { display: flex; justify-content: flex-end; }
        .tool-action { padding-inline: var(--crusher-spacing-6); padding-block: var(--crusher-spacing-2); border-radius: var(--crusher-radius-full); font-weight: 600; }
        input[type="number"].crusher-tool-control { padding: var(--crusher-spacing-2); }
        textarea.crusher-tool-control { padding: var(--crusher-spacing-3); font-family: ui-serif, Georgia, 'Times New Roman', serif; font-size: var(--crusher-font-size-lg); line-height: var(--crusher-line-height-relaxed); }
        .tool-copy-btn { background: transparent; border: 0; padding: 0; cursor: pointer; color: var(--crusher-color-brand-primary); font-weight: 500; font-size: var(--crusher-font-size-sm); }
    </style>
</head>
<body class="crusher-tool-page">

    <main class="crusher-tool-shell">
        <header class="crusher-tool-header">
            <h1 class="crusher-tool-title">Lorem Ipsum Generator</h1>
            <p class="crusher-tool-lede">Generate placeholder text for designs.</p>
        </header>

        <div class="tool-stack">
            <section class="crusher-tool-surface tool-section">
                <div class="tool-grid-2">
                    <div>
                        <label for="paras" class="tool-label">Paragraphs</label>
                        <input type="number" id="paras" value="3" min="1" max="20" class="crusher-tool-control">
                    </div>
                    <div>
                        <label for="words" class="tool-label">Words per Paragraph</label>
                        <input type="number" id="words" value="50" min="5" max="200" class="crusher-tool-control">
                    </div>
                </div>
                <div class="tool-action-row">
                    <button id="generate-btn" type="button" class="crusher-tool-action tool-action">Generate</button>
                </div>
                <div>
                    <label for="output" class="tool-label">Output</label>
                    <textarea id="output" rows="8" readonly class="crusher-tool-control"></textarea>
                </div>
                <div class="tool-copy-row">
                    <button id="copy-btn" type="button" class="tool-copy-btn">Copy to Clipboard</button>
                </div>
            </section>
        </div>
    </main>

    <a href="https://tools.muhammadhassaanjaved.com/" id="hub-bubble" class="crusher-tool-fab" title="View All Tools" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
    </a>

    <crusher-style-switcher
      default-theme="minimal"
      default-brand="#0ea5e9"
      hide-themes
      hide-theme-color></crusher-style-switcher>
    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js"></script>

    <script>
        const words = ["lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing", "elit", "sed", "do", "eiusmod", "tempor", "incididunt", "ut", "labore", "et", "dolore", "magna", "aliqua", "Ut", "enim", "ad", "minim", "veniam", "quis", "nostrud", "exercitation", "ullamco", "laboris", "nisi", "ut", "aliquip", "ex", "ea", "commodo", "consequat", "Duis", "aute", "irure", "dolor", "in", "reprehenderit", "in", "voluptate", "velit", "esse", "cillum", "dolore", "eu", "fugiat", "nulla", "pariatur", "Excepteur", "sint", "occaecat", "cupidatat", "non", "proident", "sunt", "in", "culpa", "qui", "officia", "deserunt", "mollit", "anim", "id", "est", "laborum"];

        const outputEl = document.getElementById('output');
        const copyBtn = document.getElementById('copy-btn');

        function generate() {
            const p = parseInt(document.getElementById('paras').value, 10);
            const w = parseInt(document.getElementById('words').value, 10);
            let text = "";
            for (let i = 0; i < p; i++) {
                let para = "";
                for (let j = 0; j < w; j++) {
                    para += (j === 0 ? "" : " ") + words[Math.floor(Math.random() * words.length)];
                }
                text += para + ". ";
            }
            outputEl.value = text;
        }

        document.getElementById('generate-btn').addEventListener('click', generate);

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(outputEl.value);
            } catch {
                outputEl.select();
                document.execCommand('copy');
            }
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; }, 2000);
        });

        generate();
    </script>
</body>
</html>
